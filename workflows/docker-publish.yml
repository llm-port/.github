# Build and push all llm.port Docker images to Docker Hub.
#
# Trigger options:
#   - Push to main (builds changed services only)
#   - Manual dispatch (choose which services to build)
#
# Prerequisites:
#   1. Create a Docker Hub org/user matching REGISTRY (default: llmport)
#   2. Add repo secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN
#   3. Create repos on Docker Hub: llmport/api, llmport/backend, etc.

name: Publish Docker Images

on:
  workflow_dispatch:
    inputs:
      services:
        description: "Services to build (comma-separated or 'all')"
        required: false
        default: "all"
        type: string
      registry:
        description: "Docker Hub org/user"
        required: false
        default: "llmport"
        type: string
      version:
        description: "Image tag (leave empty for auto-tagging)"
        required: false
        default: ""
        type: string

  push:
    branches: [main]
    paths:
      - "llm_port_api/**"
      - "llm_port_backend/**"
      - "llm_port_frontend/**"
      - "llm_port_rag/**"
      - "llm_port_pii/**"
      - "llm_port_mailer/**"
      - "llm_port_auth/**"
      - "llm_port_docling/**"

env:
  REGISTRY: ${{ github.event.inputs.registry || 'llmport' }}

jobs:
  # ── Determine which services to build ───────────────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      rag: ${{ steps.filter.outputs.rag }}
      pii: ${{ steps.filter.outputs.pii }}
      mailer: ${{ steps.filter.outputs.mailer }}
      auth: ${{ steps.filter.outputs.auth }}
      docling: ${{ steps.filter.outputs.docling }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for manual 'all'
        id: manual
        run: |
          SERVICES="${{ github.event.inputs.services }}"
          if [[ "$SERVICES" == "all" || -z "$SERVICES" ]]; then
            echo "build_all=true" >> "$GITHUB_OUTPUT"
          else
            echo "build_all=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: dorny/paths-filter@v3
        id: filter
        if: steps.manual.outputs.build_all != 'true' && github.event_name == 'push'
        with:
          filters: |
            api:    ['llm_port_api/**']
            backend: ['llm_port_backend/**']
            frontend: ['llm_port_frontend/**']
            rag:    ['llm_port_rag/**']
            pii:    ['llm_port_pii/**']
            mailer: ['llm_port_mailer/**']
            auth:   ['llm_port_auth/**']
            docling: ['llm_port_docling/**']

  # ── Build each service ──────────────────────────────────────────────
  api:
    needs: changes
    if: >-
      needs.changes.outputs.api == 'true' ||
      github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.services == 'all' || contains(github.event.inputs.services, 'api'))
    uses: ./.github/workflows/docker-build-reusable.yml
    with:
      service: api
      context: llm_port_api
      registry: ${{ github.event.inputs.registry || 'llmport' }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  backend:
    needs: changes
    if: >-
      needs.changes.outputs.backend == 'true' ||
      github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.services == 'all' || contains(github.event.inputs.services, 'backend'))
    uses: ./.github/workflows/docker-build-reusable.yml
    with:
      service: backend
      context: llm_port_backend
      registry: ${{ github.event.inputs.registry || 'llmport' }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  frontend:
    needs: changes
    if: >-
      needs.changes.outputs.frontend == 'true' ||
      github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.services == 'all' || contains(github.event.inputs.services, 'frontend'))
    uses: ./.github/workflows/docker-build-reusable.yml
    with:
      service: frontend
      context: llm_port_frontend
      registry: ${{ github.event.inputs.registry || 'llmport' }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  rag:
    needs: changes
    if: >-
      needs.changes.outputs.rag == 'true' ||
      github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.services == 'all' || contains(github.event.inputs.services, 'rag'))
    uses: ./.github/workflows/docker-build-reusable.yml
    with:
      service: rag
      context: llm_port_rag
      registry: ${{ github.event.inputs.registry || 'llmport' }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  pii:
    needs: changes
    if: >-
      needs.changes.outputs.pii == 'true' ||
      github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.services == 'all' || contains(github.event.inputs.services, 'pii'))
    uses: ./.github/workflows/docker-build-reusable.yml
    with:
      service: pii
      context: llm_port_pii
      registry: ${{ github.event.inputs.registry || 'llmport' }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  mailer:
    needs: changes
    if: >-
      needs.changes.outputs.mailer == 'true' ||
      github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.services == 'all' || contains(github.event.inputs.services, 'mailer'))
    uses: ./.github/workflows/docker-build-reusable.yml
    with:
      service: mailer
      context: llm_port_mailer
      registry: ${{ github.event.inputs.registry || 'llmport' }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  auth:
    needs: changes
    if: >-
      needs.changes.outputs.auth == 'true' ||
      github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.services == 'all' || contains(github.event.inputs.services, 'auth'))
    uses: ./.github/workflows/docker-build-reusable.yml
    with:
      service: auth
      context: llm_port_auth
      registry: ${{ github.event.inputs.registry || 'llmport' }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  docling:
    needs: changes
    if: >-
      needs.changes.outputs.docling == 'true' ||
      github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.services == 'all' || contains(github.event.inputs.services, 'docling'))
    uses: ./.github/workflows/docker-build-reusable.yml
    with:
      service: docling
      context: llm_port_docling
      registry: ${{ github.event.inputs.registry || 'llmport' }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
